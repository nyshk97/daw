run = '''
#!/usr/bin/env bash
eval "set -- $usage_args"
args=(); for a in "$@"; do [ -n "$a" ] && args+=("$a"); done
exec tools/reference/.venv/bin/python tools/taste/features.py "${args[@]}"
'''

