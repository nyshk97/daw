[tools]
# tools/reference/ の分析パイプライン用。torch(demucs)・basic-pitch の wheel が
# 揃っているバージョンに固定する（homebrew の 3.14 では入らない）
python = '3.12'

# --- リファレンス分析パイプライン（tools/reference/README.md） ---
# 引数は usage 方式。可変長は KDL の bool 記法で var=#true（var=true は parse error）

[tasks."ref:url"]
description = 'URLからリファレンスを1曲追加する（取得→トリム自動判定→分析。約2分）'
usage = 'arg "<args>" var=#true help="URL [名前] [--trim a-b] [--dir 親フォルダ]"'
# var=#true の $usage_args は各引数がシェルクォート付きで渡る（URL の ?= を含む引数が
# '...' ごと下流に届いて "not a valid URL" になる）。eval set -- でクォートを外す
run = '''
#!/usr/bin/env bash
eval "set -- $usage_args"
exec tools/reference/analyze-url.sh "$@"
'''

[tasks."ref:analyze"]
description = 'track.wav があるフォルダを分析し直す（約2分。スクリプトを直したあとに使う）'
usage = 'arg "<dir>" help="~/Music/daw/references/<名前>"'
run = 'tools/reference/analyze.sh "$usage_dir"'

[tasks."ref:report"]
description = '分析済みフォルダから report.md を書く（5〜10分。report.py が【機】充填→Claude Codeが【判】のみ執筆）'
usage = 'arg "<dir>" help="~/Music/daw/references/<名前>"'
run = 'tools/reference/report.sh "$usage_dir"'

[tasks."ref:card"]
description = '分析済みフォルダから制約カード card.json を再生成する（一瞬。ガチャの入力）'
usage = 'arg "<dir>" help="~/Music/daw/references/<名前>"'
run = 'tools/reference/.venv/bin/python tools/reference/card.py "$usage_dir"'

[tasks."ref:test"]
description = '分析パイプラインの回帰テスト（card.py / gates.py / analyze.py / render_report.py / report.py。fixture のみで数秒）'
run = 'cd tools/reference && .venv/bin/python tests/test_gates.py && .venv/bin/python tests/test_card.py && .venv/bin/python tests/test_analyze.py && .venv/bin/python tests/test_render_report.py && .venv/bin/python tests/test_report.py && bash tests/test_report_sh.sh'

[tasks."ref:setup"]
description = '分析パイプラインの venv を作り直す（初回・依存を変えたとき）'
run = 'tools/reference/setup.sh'

# --- 好きなビート23曲＋近接した否定例の横断分析（tools/taste/README.md） ---

[tasks."taste:sync"]
description = '正例・否定例のビート一覧をローカルcorpus manifestへ差分同期する（削除は孤児申告のみ）'
usage = 'arg "<args>" var=#true default="" help="[--dry-run] [--corpus DIR] [--picks FILE] [--contrast-picks FILE]"'
run = '''
#!/usr/bin/env bash
eval "set -- $usage_args"
args=(); for a in "$@"; do [ -n "$a" ] && args+=("$a"); done
exec tools/reference/.venv/bin/python tools/taste/corpus.py sync "${args[@]}"
'''

[tasks."taste:analyze"]
description = 'corpusを曲単位で差分取得・分析する（失敗継続・中断再開可）'
usage = 'arg "<args>" var=#true default="" help="[--only VIDEO_ID] [--retry-failed] [--dry-run] [--corpus DIR]"'
run = '''
#!/usr/bin/env bash
eval "set -- $usage_args"
args=(); for a in "$@"; do [ -n "$a" ] && args+=("$a"); done
exec tools/reference/.venv/bin/python tools/taste/corpus.py analyze "${args[@]}"
'''

[tasks."taste:grid"]
description = '全曲のtrim・拍子・小節gridを監査し、曖昧曲のclick素材を作る'
usage = 'arg "<args>" var=#true default="" help="[--only VIDEO_ID] [--apply-answers FILE] [--no-cleanup]"'
run = '''
#!/usr/bin/env bash
eval "set -- $usage_args"
args=(); for a in "$@"; do [ -n "$a" ] && args+=("$a"); done
exec tools/reference/.venv/bin/python tools/taste/grid-audit.py "${args[@]}"
'''

[tasks."taste:grid-followup"]
description = 'Grid監査のNG・不明曲に聞きやすい再確認素材を作る'
usage = 'arg "<args>" var=#true default="" help="[--corpus DIR] [--annotations FILE] [--output DIR]"'
